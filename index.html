<title>MOM HOME — постільна білизна</title>

<style>
:root{color-scheme:light;--bg:#fbf8f3;--sf:#fff;--sf2:#f3ece1;--bd:#e6dccb;--tx:#3d342a;--mt:#8a7d6b;--ac:#b89b72;--ac2:#9c7f57;--ok:#6f8a5e;--er:#b5534a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Jost,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:44px;height:44px}
.logo b{font:600 24px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.18em}.logo small{display:block;font-size:10px;letter-spacing:.3em;color:var(--mt)}
.btn{background:var(--ac2);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-weight:500}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.s{padding:6px 14px;font-size:14px}.btn.d{background:var(--er)}
.hero{background:linear-gradient(135deg,var(--sf2),var(--bg));background-size:cover;background-position:center;padding:84px 0;text-align:center;border-bottom:1px solid var(--bd)}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.1}.hero p{color:var(--mt);max-width:520px;margin:14px auto 24px}
.logo svg{flex:none}.logo>div{min-width:0}@media(max-width:560px){.wrap{padding:0 12px}.hd{gap:6px}.logo{gap:7px}.logo svg{width:34px;height:34px}.logo b{font-size:18px;letter-spacing:.1em;white-space:nowrap}.logo small{font-size:8px;letter-spacing:.16em;white-space:nowrap}.hd .btn{padding:6px 11px;font-size:13px;white-space:nowrap}.strip{font-size:12px;padding:6px 10px}.hero{padding:52px 0!important}.grid{grid-template-columns:repeat(2,1fr)!important;gap:12px!important}.card .in{padding:10px!important}.card h3{font-size:17px!important}.card .pr{font-size:19px!important}.ph{font-size:40px!important}}
.cats{display:flex;gap:8px;flex-wrap:wrap;padding:26px 0 8px}
.chip{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:7px 18px}.chip.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:16px 0 40px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--sf2);display:flex;align-items:center;justify-content:center;font:600 54px 'Cormorant Garamond',Georgia,serif;color:var(--ac)}
.ph img{width:100%;height:100%;object-fit:cover}
.card .in{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}.card .c{font-size:12px;color:var(--mt);letter-spacing:.1em;text-transform:uppercase}
.card .pr{font:600 22px 'Cormorant Garamond',Georgia,serif;color:var(--ac2);margin-top:auto}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:36px 0;text-align:center}
.perks div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px}.perks b{display:block;font:600 20px 'Cormorant Garamond',Georgia,serif}.perks span{color:var(--mt);font-size:14px}
footer{background:var(--sf2);border-top:1px solid var(--bd);padding:28px 0;text-align:center;color:var(--mt);font-size:14px}
.drawer{position:fixed;inset:0;background:#0006;display:none;justify-content:flex-end;z-index:20}.drawer.on{display:flex}
.panel{background:var(--bg);width:min(420px,100%);height:100%;overflow:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mt)}
.adm{padding:30px 0}.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sf2)}
.strip{background:var(--ac2);color:#fff;text-align:center;padding:8px 12px;font-size:14px;letter-spacing:.04em}.meta{font-size:13px;color:var(--mt);line-height:1.5}.meta b{color:var(--tx);font-weight:500}.note{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:14px;color:var(--mt);margin:10px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:999px;display:none;z-index:30}
.ph{position:relative}.bdg{position:absolute;top:10px;left:10px;background:var(--er);color:#fff;border-radius:999px;padding:3px 10px;font:500 13px Jost,sans-serif}.bdg.nw{left:auto;right:10px;background:var(--ac2)}
.old{color:var(--mt);font-size:.65em;font-weight:400}.cd{display:inline-block;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px 18px;margin:0 auto 18px;color:var(--tx)}.cd .pc{color:var(--er);font:600 26px 'Cormorant Garamond',Georgia,serif}.cd .tm{font:600 24px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;color:var(--ac2)}
.sechd{display:flex;justify-content:space-between;align-items:baseline;padding-top:30px}.sechd h2{font-size:30px}.sechd a{color:var(--ac2);font-size:14px}
.flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:center;padding:6px 0}.flt input,.flt select{margin:0}.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}.ck input{width:auto;margin:0}
.pm{position:fixed;inset:0;background:var(--bg);z-index:15;overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px)}.pm.on{display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:16px}.ph.big{border-radius:14px;font-size:90px}.thr{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.th2{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;flex:none}.th2.on{border-color:var(--ac2)}.szs{display:flex;gap:8px;flex-wrap:wrap}
body{padding-bottom:76px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--bg);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}.nav button{flex:1;background:none;border:0;padding:8px 4px 7px;color:var(--mt);font:500 11px Jost,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}.nav button.on{color:var(--ac2)}.nav svg{width:24px;height:24px}.nb{position:absolute;top:3px;left:calc(50% + 6px);background:var(--ac2);color:#fff;border-radius:999px;min-width:17px;height:17px;font-size:11px;line-height:17px;padding:0 4px}
.toast{bottom:88px!important}
@media(max-width:700px){.pgrid{grid-template-columns:1fr}}
@media(max-width:560px){.card .meta{font-size:12px}}

  pend='';var k=v.split('|');
  if(k[0]==='p')db.prods=db.prods.filter(function(p){return p.id!==k[1]});
  else if(k[0]==='c')db.cats=db.cats.filter(function(c){return c!==k[1]});
  else if(k[0]==='z')db.sizes=db.sizes.filter(function(c){return c!==k[1]});
  else if(k[0]==='o')db.orders=db.orders.filter(function(o){return o.id!==k[1]});
  save();toast('Видалено');renderAdmin();renderShop()}
 else if(t.id==='saveP'){
  readForm();var n=fs.name.trim();
  var vs=fs.variants.map(function(x){return{size:x.size.trim(),num:x.num.trim(),price:+x.price,parts:x.parts.trim()}}).filter(function(x){return x.size&&x.price>0});
  if(!n||!vs.length){toast('Вкажіть назву та хоча б один розмір з ціною');return}
  vs.forEach(function(x,i){if(!x.num)x.num=(fs.sku.trim()||'MH')+'-'+(i+1)});
  var row={id:fs.id||'p'+Date.now(),name:n,cat:fs.cat,sku:fs.sku.trim(),fabric:fs.fabric.trim(),desc:fs.desc.trim(),disc:fs.disc,pop:!!fs.pop,nw:!!fs.nw,imgs:fs.imgs,variants:vs};
  var ix=db.prods.findIndex(function(p){return p.id===fs.id});if(ix>=0)db.prods[ix]=row;else db.prods.unshift(row);
  if(save()){toast('Опубліковано');fs=null;renderAdmin();renderShop()}}
 else if(t.id==='addCat'){var c=$('nc').value.trim();if(c&&db.cats.indexOf(c)<0){db.cats.push(c);save();renderAdmin();renderShop()}}
 else if(t.id==='addSz'){var z=$('nz').value.trim();if(z&&db.sizes.indexOf(z)<0){db.sizes.push(z);save();renderAdmin()}}
 else if(t.id==='bNo'){bImg='';bDirty=true;renderAdmin()}
 else if(t.id==='saveB'){
  db.ban={strip:$('bS').value.trim(),title:$('bT').value.trim(),text:$('bP').value.trim(),btn:$('bB').value.trim(),img:bImg};
  db.set.promo={on:$('pO').checked,percent:+$('pPc').value||0,end:$('pE').value,cat:$('pC').value,label:$('pL').value.trim()};
  if(db.set.promo.on&&(!db.set.promo.percent||!db.set.promo.end)){toast('Для акції вкажіть знижку і дату завершення');return}
  if(save()){bDirty=false;toast('Збережено');renderShop()}}
 else if(t.id==='saveS'){db.set.tg=$('sT').value.trim();db.set.email=$('sE').value.trim();save();toast('Збережено')}
 else if(t.id==='saveL'){var l=$('sL').value.trim(),w=$('sP').value;if(!l){toast('Вкажіть логін');return}
  var c2=db.set.admin;if(w){if(w.length<6){toast('Пароль — мінімум 6 символів');return}var sl=salt();db.set.admin={login:l,salt:sl,hash:await sha(w,sl)}}else db.set.admin={login:l,salt:c2.salt,hash:c2.hash};save();toast('Збережено');$('sP').value=''}
 else if(t.id==='exp'){var bl=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='mom-home-backup.json';document.body.appendChild(a);a.click();a.remove()}
});
document.addEventListener('change',async function(ev){
 var t=ev.target;
 if(t.id==='fF'&&t.files.length){readForm();var fl=Array.from(t.files);for(var i=0;i<fl.length;i++){await new Promise(function(res){resize(fl[i],function(d){fs.imgs.push(d);res()})})}renderAdmin()}
 else if(t.id==='bF'&&t.files[0]){resize(t.files[0],function(d){bImg=d;bDirty=true;$('bI').innerHTML='<img class="th" src="'+d+'" alt=""> Фото додано'})}
 else if(t.id==='imp'&&t.files[0]){var r=new FileReader();r.onload=function(){try{db=Object.assign(db,JSON.parse(r.result));save();toast('Копію завантажено');renderAdmin();renderShop()}catch(e){toast('Файл не підходить')}};r.readAsText(t.files[0])}
 else if(t.id==='fsz'){fSize=t.value;renderGrid()}else if(t.id==='ffb'){fFab=t.value;renderGrid()}else if(t.id==='fso'){fSort=t.value;renderGrid()}else if(t.id==='fsl'){fSale=t.checked;renderGrid()}
 else if(t.getAttribute&&t.getAttribute('data-st')){var o=db.orders.find(function(x){return x.id===t.getAttribute('data-st')});if(o){o.status=t.value;save();toast('Статус оновлено')}}
});
document.addEventListener('input',function(ev){var t=ev.target;if(t.id==='fq'){fQ=t.value;renderGrid()}});
var view='home';
function go(h){if(location.hash===h||(h===''&&(location.hash===''||location.hash==='#')))route();else location.hash=h}
function navSet(){var dr=$('drawer').classList.contains('on'),a=dr?(mode==='cart'?'cart':mode==='acct'?'acct':''):(view==='cat'?'cat':'home');Array.prototype.forEach.call(document.querySelectorAll('#nav [data-nv]'),function(b){b.classList.toggle('on',b.getAttribute('data-nv')===a)})}
function route(){var h=location.hash,ad=h==='#admin',pm=h.indexOf('#p-')===0;
 $('shop').style.display=ad?'none':'';$('admin').style.display=ad?'':'none';$('nav').style.display=ad?'none':'';
 if(ad){$('pm').classList.remove('on');renderAdmin();return}
 if(!pm){var nv=h==='#catalog'?'cat':'home';if(nv!==view)scrollTo(0,0);view=nv}
 $('viewHome').style.display=view==='home'?'':'none';$('viewCat').style.display=view==='cat'?'':'none';
 renderShop();navSet();
 if(pm){pmId=h.slice(3);var p=pf(pmId);if(p){pmSize=p.variants[0].size;pmImg=0;pmQ=1;renderPM();$('pm').classList.add('on');$('pm').scrollTop=0}else location.hash=''}
 else $('pm').classList.remove('on')}
document.addEventListener('click',function(){setTimeout(navSet,0)});
addEventListener('hashchange',route);
(async function(){
 if(!db.set.admin){var sl=salt();db.set.admin={login:'admin',salt:sl,hash:await sha('momhome2026',sl)}}
 if(db.set.promo===null){var d=new Date(Date.now()+7*864e5-new Date().getTimezoneOffset()*6e4);db.set.promo={on:true,percent:15,end:d.toISOString().slice(0,16),cat:'',label:'Осінній розпродаж'}}
 if(!db.prods.some(function(p){return 'pop' in p||'nw' in p})){db.prods.forEach(function(p){p.pop=['p1','p2','p7'].indexOf(p.id)>=0;p.nw=['p2','p5','p8'].indexOf(p.id)>=0})}
 save();route()})();
